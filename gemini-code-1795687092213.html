<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080b14" />
  <title>Neon Reflex: Orbit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
      touch-action: manipulation;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: fixed;
      top: env(safe-area-inset-top, 20px);
      left: 0;
      right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .stat-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 14px;
      padding: 8px 14px;
      backdrop-filter: blur(6px);
      min-width: 82px;
      text-align: center;
    }
    .stat-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #94a3b8;
    }
    .stat-val {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 11, 20, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      z-index: 20;
      transition: opacity 0.2s ease;
    }
    #overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    h1 {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #38bdf8, #a855f7, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    p {
      color: #cbd5e1;
      font-size: 15px;
      max-width: 310px;
      line-height: 1.5;
      margin-bottom: 26px;
    }
    .btn {
      background: linear-gradient(135deg, #0284c7, #6366f1);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 16px 44px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.8px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.45);
      cursor: pointer;
    }
    .btn:active {
      transform: scale(0.96);
    }
    #final-score {
      font-size: 52px;
      font-weight: 900;
      color: #38bdf8;
      margin: 6px 0 18px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="stat-box">
      <div class="stat-label">Punti</div>
      <div class="stat-val" id="score">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Combo</div>
      <div class="stat-val" id="combo" style="color:#a855f7;">x1</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Record</div>
      <div class="stat-val" id="best" style="color:#f43f5e;">0</div>
    </div>
  </div>

  <canvas id="game"></canvas>

  <div id="overlay">
    <h1 id="title">NEON ORBIT</h1>
    <div id="final-score">0</div>
    <p id="desc">Tocca ovunque sullo schermo per invertire la rotazione. Raccogli le sfere viola ed evita i raggi rossi.</p>
    <button class="btn" id="start-btn">GIOCA</button>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const descEl = document.getElementById('desc');
    const finalScoreEl = document.getElementById('final-score');
    const startBtn = document.getElementById('start-btn');

    let width, height, cx, cy, orbitRadius;
    let bestScore = parseInt(localStorage.getItem('neon_orbit_best') || '0', 10);
    bestEl.textContent = bestScore;

    // Audio synthesizer (nessun file esterno)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playTone(freq, type, duration, vol = 0.12) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      cx = width / 2;
      cy = height / 2 + 20;
      orbitRadius = Math.min(width, height) * 0.31;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'MENU';
    let playerAngle = -Math.PI / 2;
    let direction = 1;
    let baseSpeed = 2.4;
    let score = 0;
    let combo = 1;
    let targetAngle = Math.PI / 2;
    let hazards = [];
    let particles = [];
    let trail = [];
    let shake = 0;
    let lastTime = 0;

    function spawnParticles(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 60 + Math.random() * 180;
        particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 1,
          color,
          size: 2.5 + Math.random() * 3.5
        });
      }
    }

    function placeNewTarget() {
      let candidate;
      do {
        candidate = Math.random() * Math.PI * 2;
      } while (Math.abs(normalizeAngle(candidate - playerAngle)) < 1.1);
      targetAngle = candidate;
    }

    function syncHazards() {
      const desiredCount = Math.min(4, 1 + Math.floor(score / 8));
      while (hazards.length < desiredCount) {
        hazards.push({
          angle: Math.random() * Math.PI * 2,
          speed: (0.7 + Math.random() * 0.9) * (Math.random() < 0.5 ? 1 : -1),
          arc: 0.24
        });
      }
    }

    function normalizeAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function resetGame() {
      score = 0;
      combo = 1;
      direction = 1;
      playerAngle = -Math.PI / 2;
      hazards = [];
      particles = [];
      trail = [];
      shake = 0;
      scoreEl.textContent = '0';
      comboEl.textContent = 'x1';
      placeNewTarget();
      syncHazards();
      state = 'PLAYING';
      overlay.classList.add('hidden');
      playTone(520, 'sine', 0.12);
    }

    function gameOver() {
      state = 'GAMEOVER';
      shake = 14;
      const px = cx + Math.cos(playerAngle) * orbitRadius;
      const py = cy + Math.sin(playerAngle) * orbitRadius;
      spawnParticles(px, py, '#f43f5e', 28);
      playTone(140, 'sawtooth', 0.35, 0.18);

      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('neon_orbit_best', String(bestScore));
        bestEl.textContent = bestScore;
      }

      titleEl.textContent = 'GAME OVER';
      finalScoreEl.textContent = score;
      finalScoreEl.style.display = 'block';
      descEl.textContent = score >= bestScore && score > 0
        ? 'Nuovo record personale! Tocca per riprovare.'
        : 'Hai colpito un raggio rosso. Tocca per riprovare.';
      startBtn.textContent = 'RIGIOCA';
      setTimeout(() => overlay.classList.remove('hidden'), 380);
    }

    function handleTap(e) {
      if (state !== 'PLAYING') return;
      if (e) e.preventDefault();
      direction *= -1;
      combo = 1;
      comboEl.textContent = 'x1';
      playTone(340, 'triangle', 0.07, 0.08);
    }

    window.addEventListener('pointerdown', (e) => {
      if (e.target === startBtn) return;
      handleTap(e);
    });

    startBtn.addEventListener('click', resetGame);

    function update(dt) {
      if (shake > 0) shake = Math.max(0, shake - dt * 45);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt * 2.2;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (state !== 'PLAYING') return;

      const currentSpeed = baseSpeed + Math.min(2.2, score * 0.045);
      playerAngle = normalizeAngle(playerAngle + direction * currentSpeed * dt);

      const px = cx + Math.cos(playerAngle) * orbitRadius;
      const py = cy + Math.sin(playerAngle) * orbitRadius;
      trail.push({ x: px, y: py, life: 1 });
      if (trail.length > 18) trail.shift();
      trail.forEach(t => t.life -= dt * 3.5);

      // Raccolta sfera viola
      if (Math.abs(normalizeAngle(playerAngle - targetAngle)) < 0.19) {
        score += combo;
        combo = Math.min(5, combo + 1);
        scoreEl.textContent = score;
        comboEl.textContent = 'x' + combo;
        const tx = cx + Math.cos(targetAngle) * orbitRadius;
        const ty = cy + Math.sin(targetAngle) * orbitRadius;
        spawnParticles(tx, ty, '#a855f7', 16);
        playTone(580 + combo * 90, 'sine', 0.14, 0.12);
        placeNewTarget();
        syncHazards();
      }

      // Movimento e collisione raggi rossi
      for (const h of hazards) {
        h.angle = normalizeAngle(h.angle + h.speed * (1 + score * 0.015) * dt);
        if (Math.abs(normalizeAngle(playerAngle - h.angle)) < h.arc * 0.72) {
          gameOver();
          break;
        }
      }
    }

    function draw() {
      ctx.save();
      ctx.fillStyle = '#080b14';
      ctx.fillRect(0, 0, width, height);

      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      }

      // Anello orbitale principale
      ctx.beginPath();
      ctx.arc(cx, cy, orbitRadius, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.18)';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Nucleo centrale pulsante
      const pulse = 24 + Math.sin(performance.now() * 0.005) * 4;
      const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, pulse * 1.8);
      grad.addColorStop(0, 'rgba(56, 189, 248, 0.45)');
      grad.addColorStop(1, 'rgba(56, 189, 248, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, pulse * 1.8, 0, Math.PI * 2);
      ctx.fill();

      // Raggi ostacolo rossi
      for (const h of hazards) {
        ctx.beginPath();
        ctx.arc(cx, cy, orbitRadius, h.angle - h.arc, h.angle + h.arc);
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.shadowColor = '#f43f5e';
        ctx.shadowBlur = 14;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // Sfera obiettivo viola
      const tx = cx + Math.cos(targetAngle) * orbitRadius;
      const ty = cy + Math.sin(targetAngle) * orbitRadius;
      ctx.beginPath();
      ctx.arc(tx, ty, 11, 0, Math.PI * 2);
      ctx.fillStyle = '#c084fc';
      ctx.shadowColor = '#a855f7';
      ctx.shadowBlur = 16;
      ctx.fill();
      ctx.shadowBlur = 0;

      // Scia giocatore
      for (const t of trail) {
        if (t.life <= 0) continue;
        ctx.beginPath();
        ctx.arc(t.x, t.y, 9 * t.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(56, 189, 248, ${t.life * 0.35})`;
        ctx.fill();
      }

      // Giocatore
      if (state !== 'GAMEOVER') {
        const px = cx + Math.cos(playerAngle) * orbitRadius;
        const py = cy + Math.sin(playerAngle) * orbitRadius;
        ctx.beginPath();
        ctx.arc(px, py, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.shadowBlur = 0;
      }

      // Particelle
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000 || 0.016);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
